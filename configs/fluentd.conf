# Fluentd configuration for Star Warehouse AI structured logs
# This configuration reads JSON logs and forwards them to Grafana Loki

# Source: tail JSON log files from the application
<source>
  @type tail
  @id star_warehouse_ai_logs
  path /var/log/star-warehouse-ai/*.json.log,/var/log/star-warehouse-ai/app.log
  pos_file /var/log/fluentd/star-warehouse-ai.log.pos
  tag star_warehouse_ai.agent
  <parse>
    @type json
    time_key timestamp
    time_format %Y-%m-%dT%H:%M:%S.%N%z
    keep_time_key true
  </parse>
</source>

# Source: tail uvicorn access logs
<source>
  @type tail
  @id star_warehouse_ai_access
  path /var/log/star-warehouse-ai/access.log
  pos_file /var/log/fluentd/star-warehouse-ai-access.log.pos
  tag star_warehouse_ai.agent.access
  <parse>
    @type json
    time_key timestamp
    time_format %Y-%m-%dT%H:%M:%S.%N%z
    keep_time_key true
  </parse>
</source>

# Filter: add service metadata
<filter star_warehouse_ai.agent>
  @type record_transformer
  <record>
    service star-warehouse-ai
    environment ${ENV['ENVIRONMENT'] || 'production'}
    hostname ${hostname}
  </record>
</filter>

# Filter: enrich with Kubernetes metadata (if running in K8s)
# Uncomment if deployed in Kubernetes
# <filter star_warehouse_ai.agent>
#   @type kubernetes_metadata
# </filter>

# Output: Grafana Loki
# Using the fluent-plugin-grafana-loki plugin
<match star_warehouse_ai.agent>
  @type loki
  @id loki_output
  url http://loki:3100
  # username loki
  # password secret
  # tenant_id star-warehouse-ai

  extra_labels {"job":"star-warehouse-ai","source":"fluentd"}
  label_keys level,logger,correlation_id,trace_id,service,environment
  line_format json

  <buffer>
    @type memory
    flush_interval 1s
    flush_mode interval
    chunk_limit_size 1m
    queue_limit_length 32
    retry_max_interval 30
    retry_forever true
  </buffer>
</match>

# Output: also write to stdout for debugging (optional)
# <match star_warehouse_ai.agent>
#   @type stdout
# </match>

# System settings
<system>
  log_level info
  workers 2
</system>
