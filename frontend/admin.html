<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6fa" />
    <script>
      ;(() => {
        try {
          const savedTheme = localStorage.getItem('star-warehouse-theme')
          const theme =
            savedTheme === 'light' || savedTheme === 'dark'
              ? savedTheme
              : matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', theme === 'dark' ? '#10121a' : '#f5f6fa')
        } catch {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <meta name="description" content="星仓 AI 智能客服运营管理中心" />
    <title>星仓 AI 运营中心</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/apps/admin/main.tsx"></script>
  </body>
</html>
