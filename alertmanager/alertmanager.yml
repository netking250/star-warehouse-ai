global:
  resolve_timeout: 5m

# The local/demo profile deliberately has no external notification credentials. A loopback sink
# keeps Alertmanager routing syntactically complete without sending alerts outside the machine.
route:
  group_by: [alertname, severity, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: local-noop
  routes:
    - matchers: [severity="critical"]
      receiver: local-noop
      continue: true
    - matchers: [severity="warning"]
      receiver: local-noop
      continue: true

receivers:
  - name: local-noop
    webhook_configs:
      - url: http://127.0.0.1:65535/observability/alertmanager
        send_resolved: true

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, service]
