services:
  # 核心数据库：PostgreSQL
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_base}
    # 以下端口映射仅用于本地开发调试，生产环境请移除或限制访问来源
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 会话记忆缓存：Redis
  redis:
    image: redis/redis-stack-server:7.4.0-v8
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-devpassword}
    command: redis-server --requirepass ${REDIS_PASSWORD:-devpassword} --loadmodule /opt/redis-stack/lib/redisearch.so --loadmodule /opt/redis-stack/lib/rejson.so
    # 以下端口映射仅用于本地开发调试，生产环境请移除或限制访问来源
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Celery message broker. Management UI is loopback-only for local development.
  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-star_warehouse_ai}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dev-rabbitmq-password}
    # Development-only mappings. Do not expose AMQP or management ports publicly.
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.16.3
    restart: unless-stopped
    # 以下端口映射仅用于本地开发调试，生产环境请移除或限制访问来源
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery_worker: 
    build: .
    image: star-warehouse-ai:local
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4 --pool=solo --queues=critical,default -E
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: db
      DB_CAPABILITY: runtime
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-devpassword}
      QDRANT_URL: http://qdrant:6333
      KNOWLEDGE_UPLOAD_DIR: /app/uploads/knowledge
      SERVICE_HEALTH_URL: http://app:8000/health
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-star_warehouse_ai}:${RABBITMQ_PASSWORD:-dev-rabbitmq-password}@rabbitmq:5672//
      LOG_FORMAT: ${LOG_FORMAT:-json}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-star-warehouse-ai-worker}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - ./app:/app/app
      - knowledge_uploads:/app/uploads
    restart: unless-stopped

  celery_scheduler:
    build: .
    image: star-warehouse-ai:local
    command: celery -A app.celery_app beat --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: db
      DB_CAPABILITY: runtime
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-devpassword}
      QDRANT_URL: http://qdrant:6333
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-star_warehouse_ai}:${RABBITMQ_PASSWORD:-dev-rabbitmq-password}@rabbitmq:5672//
      LOG_FORMAT: ${LOG_FORMAT:-json}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-star-warehouse-ai-scheduler}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - ./app:/app/app
    restart: unless-stopped

  outbox_relay:
    build: .
    image: star-warehouse-ai:local
    command: python -m app.outbox
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: db
      DB_CAPABILITY: maintenance
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-star_warehouse_ai}:${RABBITMQ_PASSWORD:-dev-rabbitmq-password}@rabbitmq:5672//
      LOG_FORMAT: ${LOG_FORMAT:-json}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-star-warehouse-ai-outbox}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - ./app:/app/app
    restart: unless-stopped

  celery_maintenance:
    build: .
    image: star-warehouse-ai:local
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2 --pool=solo --queues=maintenance -E
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: db
      DB_CAPABILITY: maintenance
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-devpassword}
      QDRANT_URL: http://qdrant:6333
      KNOWLEDGE_UPLOAD_DIR: /app/uploads/knowledge
      SERVICE_HEALTH_URL: http://app:8000/health
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-star_warehouse_ai}:${RABBITMQ_PASSWORD:-dev-rabbitmq-password}@rabbitmq:5672//
      LOG_FORMAT: ${LOG_FORMAT:-json}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-star-warehouse-ai-maintenance}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - ./app:/app/app
      - knowledge_uploads:/app/uploads
    restart: unless-stopped

  # Optional DEV-ONLY generic OIDC demo provider. Start with:
  # docker compose --profile identity up -d keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    profiles: ["identity"]
    command: ["start-dev", "--import-realm", "--hostname=http://localhost:8081"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_DEMO_ADMIN:-dev-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_DEMO_ADMIN_PASSWORD:-dev-only-change-me-admin}
      KEYCLOAK_DEMO_CLIENT_SECRET: ${KEYCLOAK_DEMO_CLIENT_SECRET:-dev-only-change-me-oidc-client}
      KEYCLOAK_DEMO_USER_PASSWORD: ${KEYCLOAK_DEMO_USER_PASSWORD:-dev-only-change-me-user}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./deploy/keycloak/star-warehouse-realm.json:/opt/keycloak/data/import/star-warehouse-realm.json:ro
    restart: unless-stopped

  # FastAPI 应用
  app:
    build: .
    image: star-warehouse-ai:local
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # 以下端口映射仅用于本地开发调试，生产环境请移除或限制访问来源
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      celery_worker:
        condition: service_started
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: db
      DB_CAPABILITY: runtime
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-devpassword}
      QDRANT_URL: http://qdrant:6333
      KNOWLEDGE_UPLOAD_DIR: /app/uploads/knowledge
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-star_warehouse_ai}:${RABBITMQ_PASSWORD:-dev-rabbitmq-password}@rabbitmq:5672//
      LOG_FORMAT: ${LOG_FORMAT:-json}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-star-warehouse-ai-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - ./app:/app/app
      - knowledge_uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data: 
  redis_data:
  rabbitmq_data:
  qdrant_storage:
  knowledge_uploads:
