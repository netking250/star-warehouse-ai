{{- if .Values.backup.enabled }}
{{- if not .Values.demoInfrastructure.enabled }}
{{- fail "backup.enabled is supported only with the disposable/demo PostgreSQL profile; production uses the managed-database backup contract" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "star-warehouse-ai.fullname" . }}-backup-script
  labels:
    {{- include "star-warehouse-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
data:
  backup-postgres.sh: |-
{{ .Files.Get "files/backup-postgres.sh" | indent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "star-warehouse-ai.fullname" . }}-backup
  labels:
    {{- include "star-warehouse-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.demoInfrastructure.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backup.storage }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "star-warehouse-ai.fullname" . }}-backup-bootstrap-{{ .Release.Revision }}
  labels:
    {{- include "star-warehouse-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  {{- include "star-warehouse-ai.backupPodTemplate" . | nindent 2 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "star-warehouse-ai.fullname" . }}-backup
  labels:
    {{- include "star-warehouse-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.backup.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.backup.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      {{- include "star-warehouse-ai.backupPodTemplate" . | nindent 6 }}
{{- end }}
