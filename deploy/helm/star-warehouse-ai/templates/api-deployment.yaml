apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "star-warehouse-ai.fullname" . }}-api
  labels:
    {{- include "star-warehouse-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "star-warehouse-ai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "star-warehouse-ai.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        {{- include "star-warehouse-ai.podAnnotations" . | nindent 8 }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "star-warehouse-ai.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- include "star-warehouse-ai.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.migration.enabled }}
      initContainers:
        {{- include "star-warehouse-ai.migrationInitContainer" (dict "root" . "capability" "runtime") | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "star-warehouse-ai.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn"]
          args: ["app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          {{- include "star-warehouse-ai.runtimeEnvFrom" . | nindent 10 }}
          env:
            {{- include "star-warehouse-ai.runtimeEnv" . | nindent 12 }}
            {{- include "star-warehouse-ai.databaseEnv" (dict "root" . "capability" "runtime") | nindent 12 }}
            - name: DB_CAPABILITY
              value: runtime
            - name: OTEL_SERVICE_NAME
              value: star-warehouse-ai-api
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - >-
                  import json,sys,urllib.request;
                  data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5));
                  sys.exit(0 if data.get('status') == 'healthy' else 1)
            periodSeconds: 10
            timeoutSeconds: 7
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            {{- include "star-warehouse-ai.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "star-warehouse-ai.volumes" . | nindent 8 }}
