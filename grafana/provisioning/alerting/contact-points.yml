apiVersion: 1

contactPoints:
  - orgId: 1
    name: email-default
    receivers:
      - uid: email-default-uid
        type: webhook
        settings:
          url: "http://127.0.0.1:65535/observability/email"
          httpMethod: POST
          maxAlerts: 0
        disableResolveMessage: false

  - orgId: 1
    name: pagerduty-critical
    receivers:
      - uid: pagerduty-critical-uid
        type: webhook
        settings:
          url: "http://127.0.0.1:65535/observability/critical"
          httpMethod: POST
          maxAlerts: 0
        disableResolveMessage: false

  - orgId: 1
    name: webhook-default
    receivers:
      - uid: webhook-default-uid
        type: webhook
        settings:
          url: http://localhost:8000/api/v1/admin/alerts/webhook
          httpMethod: POST
          maxAlerts: 0
          title: 'LOCAL DEMO: {{ .Status | toUpper }}: {{ .GroupLabels.alertname }}'
          message: 'Local no-op receiver; configure deployment secrets outside this repository.'
        disableResolveMessage: false

  - orgId: 1
    name: slack-alerts
    receivers:
      - uid: slack-alerts-uid
        type: webhook
        settings:
          url: "http://127.0.0.1:65535/observability/slack"
          httpMethod: POST
          maxAlerts: 0
          title: '{{ .Status | toUpper }}: {{ .GroupLabels.alertname }}'
          message: 'Local no-op receiver; configure deployment secrets outside this repository.'
        disableResolveMessage: false

deleteContactPoints: []
templates: []
