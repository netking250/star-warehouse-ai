name: Monitoring as Code

on:
  push:
    branches: [main]
    paths:
      - "grafana/**"
      - "prometheus/**"
      - "alertmanager/**"
      - "loki/**"
      - "tempo/**"
      - "otel/**"
      - "promtail/**"
      - "mimir/**"
      - "docker-compose.monitoring.yml"
      - "tests/monitoring/**"
      - ".github/workflows/monitoring.yml"
  pull_request:
    branches: [main]
    paths:
      - "grafana/**"
      - "prometheus/**"
      - "alertmanager/**"
      - "loki/**"
      - "tempo/**"
      - "otel/**"
      - "promtail/**"
      - "mimir/**"
      - "docker-compose.monitoring.yml"
      - "tests/monitoring/**"
      - ".github/workflows/monitoring.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-config:
    name: Validate monitoring config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate Compose model
        run: docker compose -f docker-compose.monitoring.yml config --quiet
      - name: Validate Grafana dashboards
        run: |
          for dashboard in grafana/dashboards/*.json; do
            jq -e '.title and .uid and (.panels | length > 0)' "$dashboard" >/dev/null
          done
          test "$(jq -r '.uid' grafana/dashboards/*.json | sort | uniq -d | wc -l)" -eq 0
      - name: Validate Prometheus configuration
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.2.0 check config /etc/prometheus/prometheus.yml
      - name: Validate Alertmanager configuration
        run: |
          cp alertmanager/alertmanager.yml /tmp/star-warehouse-alertmanager.yml
          sed -i \
            -e "s#\${SMTP_HOST}#localhost:587#g" \
            -e "s#\${ALERT_EMAIL_FROM}#alerts@example.com#g" \
            -e "s#\${ALERT_ADMIN_EMAILS}#oncall@example.com#g" \
            -e "s#\${ALERT_WEBHOOK_URL}#http://localhost:8000/api/v1/admin/alerts/webhook#g" \
            /tmp/star-warehouse-alertmanager.yml
          docker run --rm --entrypoint /bin/amtool \
            -v /tmp/star-warehouse-alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro \
            prom/alertmanager:v0.27.0 check-config /etc/alertmanager/alertmanager.yml

  monitoring-tests:
    name: Monitoring tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.6.5"
          enable-cache: ${{ github.event_name != 'pull_request' }}
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: Verify locked dependency graph
        run: uv lock --check
      - run: uv run pytest --confcutdir=tests/monitoring tests/monitoring -q
