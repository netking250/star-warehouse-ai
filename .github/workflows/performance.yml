name: Performance Regression

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "tests/performance/**"
      - ".github/workflows/performance.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Performance regression
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_star_warehouse_ai
        options: >-
          --health-cmd "pg_isready -U postgres -d test_star_warehouse_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis/redis-stack-server:7.4.0-v8
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["6379:6379"]
      qdrant:
        image: qdrant/qdrant:v1.16.3
        options: >-
          --health-cmd "/bin/bash -c 'cat < /dev/null > /dev/tcp/localhost/6333'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["6333:6333"]
    env:
      PROJECT_NAME: 星仓 AI 智能客服
      API_V1_STR: /api/v1
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test_star_warehouse_ai
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      QDRANT_URL: http://localhost:6333
      QDRANT_API_KEY: ""
      OPENAI_API_KEY: sk-test
      OPENAI_BASE_URL: http://localhost:8000/v1
      DASHSCOPE_API_KEY: ""
      RERANK_BASE_URL: http://localhost:8000/v1
      CELERY_BROKER_URL: redis://:testpassword@localhost:6379/0
      CELERY_RESULT_BACKEND: redis://:testpassword@localhost:6379/0
      SECRET_KEY: test-secret-key-at-least-32-bytes-long-123
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9
        with:
          version: "0.6.5"
          enable-cache: true
      - run: uv sync --frozen
      - name: Run performance regression suite
        run: mkdir -p reports && uv run pytest tests/performance -q --junitxml=reports/performance.xml
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-report-${{ github.run_id }}
          path: reports/performance.xml
          if-no-files-found: error
          retention-days: 14
