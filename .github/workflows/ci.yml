name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  brand-docs:
    name: Brand & docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify project identity and local documentation links
        run: python scripts/check_project_identity.py

  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9
        with:
          version: "0.6.5"
          enable-cache: true
      - run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check app tests
      - name: Ruff format
        run: uv run ruff format --check app tests
      - name: Type check
        run: uv run ty check --error-on-warning app tests

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_star_warehouse_ai
        options: >-
          --health-cmd "pg_isready -U postgres -d test_star_warehouse_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis/redis-stack-server:7.4.0-v8
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      qdrant:
        image: qdrant/qdrant:v1.16.3
        options: >-
          --health-cmd "/bin/bash -c 'cat < /dev/null > /dev/tcp/localhost/6333'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6333:6333
    env:
      PROJECT_NAME: 星仓 AI 智能客服
      SERVICE_NAME: star-warehouse-ai
      API_V1_STR: /api/v1
      ENABLE_OPENAPI_DOCS: "False"
      CORS_ORIGINS: '["http://localhost:5173"]'
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test_star_warehouse_ai
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      QDRANT_URL: http://localhost:6333
      QDRANT_API_KEY: ""
      OPENAI_API_KEY: sk-test
      OPENAI_BASE_URL: http://localhost:8000/v1
      DASHSCOPE_API_KEY: ""
      RERANK_BASE_URL: http://localhost:8000/v1
      CELERY_BROKER_URL: redis://:testpassword@localhost:6379/0
      CELERY_RESULT_BACKEND: redis://:testpassword@localhost:6379/0
      SECRET_KEY: test-secret-key-at-least-32-bytes-long-123
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9
        with:
          version: "0.6.5"
          enable-cache: true
      - run: uv sync --frozen
      - name: Run test suite with coverage gate
        run: uv run pytest --cov=app --cov-fail-under=75

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Prettier
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e

  docker-smoke:
    name: Docker smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prepare isolated CI environment
        run: |
          cp .env.example .env
          sed -i 's/your_secure_password_here/postgres/' .env
          sed -i 's/your_qdrant_api_key_here//' .env
          sed -i 's#https://api.openai.com/v1#http://localhost:9/v1#' .env
      - name: Build application image
        run: docker compose build app
      - name: Start infrastructure
        run: docker compose up -d --wait db redis qdrant
      - name: Apply migrations
        run: docker compose run --rm --no-deps app alembic upgrade head
      - name: Start API and verify health
        run: |
          docker compose up -d --no-deps app
          for attempt in {1..90}; do
            if curl --fail --silent --max-time 5 http://localhost:8000/health; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs app
          exit 1
      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down --volumes
